<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カフェ</title>
    <style>
      body { margin:0; font-family: "Hiragino Kaku Gothic ProN", sans-serif; background:#f9f6f2; color:#2a2a2a; }
      .container { max-width: 1100px; margin:0 auto; padding:24px; }
      .hero { background: linear-gradient(135deg,#3f2a20,#b98e67); color:white; padding:50px 24px; border-radius:18px; }
      .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:18px; }
      .card { background:#fff; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.05); padding:20px; }
      .menu-item { display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:10px 0; }
      form { display:grid; gap:12px; }
      input, select, textarea, button { width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; }
      .btn { background:#5f3b2a; color:white; border:none; cursor:pointer; }
      @media print { .no-print { display:none !important; } }
    </style>
  </head>
  <body data-business-type="cafe" data-business-name="森のブレンドカフェ">
    <div class="container">
      <div class="hero no-print">
        <h1>森のブレンドカフェ</h1>
        <p>手作りコーヒーと日替わりスイーツで、ゆったり過ごすひととき。</p>
        <button class="btn" data-action="print">印刷</button>
      </div>

      <div class="section grid">
        <div class="card">
          <h3>人気メニュー</h3>
          <div class="menu-item"><span>ハンドドリップコーヒー</span><strong>480円</strong></div>
          <div class="menu-item"><span>カフェラテ</span><strong>560円</strong></div>
          <div class="menu-item"><span>チーズケーキ</span><strong>420円</strong></div>
          <div class="menu-item"><span>クロワッサン</span><strong>360円</strong></div>
        </div>
        <div class="card">
          <h3>営業時間</h3>
          <p>平日 8:00〜19:00<br />土日 9:00〜20:00</p>
        </div>
        <div class="card">
          <h3>お知らせ</h3>
          <p>貸し切り・団体利用にも対応します。</p>
        </div>
      </div>

      <div class="section card">
        <h3>予約フォーム</h3>
        <form data-reservation-form data-form-type="reservation">
          <input name="reservation_date" type="date" required />
          <select name="reservation_slot"></select>
          <input name="name" placeholder="お名前" required />
          <input name="tel" type="tel" placeholder="電話番号" required />
          <button type="submit" class="btn">予約する</button>
        </form>
      </div>

      <div class="section card">
        <h3>お問い合わせ</h3>
        <form data-form-type="contact" data-submit-url="/api/contact" data-success-message="お問い合わせを受け付けました。">
          <input name="name" placeholder="お名前" required />
          <input name="email" type="email" placeholder="メールアドレス" required />
          <textarea name="notes" placeholder="ご要望・ご質問" rows="5" required></textarea>
          <button type="submit" class="btn">送信</button>
        </form>
      </div>
    </div>

    <script type="module" src="/backend/tools/js/index.js"></script>
  </body>
</html>
